<!doctype html>
<!--
  Camera turret controller.

  Your face in the camera -> turret aims (X servo D8, Y servo D10)
  Hold SPACE / hold FIRE  -> DC motors (D5) spin
  Disconnect              -> servos recenter, motors off

  Needs Chrome or Edge (Web Serial). Just double-click this file in Finder — no server needed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Turret</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --text: #e8e9ec; --muted: #8a8f98;
    --line: #2a2d34; --ok: #3ddc84; --fire: #ff4d4d; --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .stage { position: relative; width: 100%; max-width: 720px; aspect-ratio: 4 / 3;
           background: #000; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stage.firing { border-color: var(--fire); box-shadow: 0 0 0 4px rgba(255,77,77,.35); }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; transform: scaleX(-1); }   /* mirror so it feels natural */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         width: 100%; max-width: 720px; margin-top: 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #fire { background: #3a1416; border-color: var(--fire); user-select: none; touch-action: none; }
  #fire.on { background: var(--fire); color: #000; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=password] { flex: 1; min-width: 200px; background: var(--panel); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; }
  label { color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .readout { font-family: ui-monospace, Menlo, monospace; margin-left: auto; }
  .status { width: 100%; max-width: 720px; margin-top: 8px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>Camera Turret</h1>

<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="bar">
  <button id="cam">Start camera</button>
  <button id="connect">Connect Arduino</button>
  <button id="fire">FIRE (hold / space)</button>
  <label>track <select id="mode"><option value="face">face</option><option value="bullseye">bullseye</option></select></label>
  <label><input type="checkbox" id="invx" checked> invert X</label>
  <label><input type="checkbox" id="invy"> invert Y</label>
  <span class="readout" id="readout">pan=90 tilt=90</span>
</div>
<div class="bar">
  <label><input type="checkbox" id="voice" checked> voice</label>
  <input type="password" id="elkey" placeholder="ElevenLabs API key (optional)" autocomplete="off">
</div>
<div class="status" id="status">Start the camera, then connect the Arduino.</div>

<script src="voice/lines.js"></script>      <!-- voice lines + saved MP3s, made by voice/make_voice.py -->
<script src="elevenlabs_key.js"></script>   <!-- optional, gitignored: window.ELEVENLABS_KEY = "sk_..." -->
<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// Same limits as project_turrent.ino
const X_MIN = 20, X_MAX = 160;
const Y_MIN = 40, Y_MAX = 130;
const SEND_HZ = 30;
const SMOOTH = 0.15;   // 0..1, higher = snappier, lower = smoother
const DEADBAND = 3;    // degrees; ignore aim changes smaller than this (stops jitter)

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const status = msg => { $("status").textContent = msg; };

const state = { fx: 0.5, fy: 0.5, fire: false, face: null, ax: 90, ay: 90 };
let detector = null, port = null, writer = null, writing = false, lastSend = 0;

// ---------- voice callouts ----------
// Lines and their saved MP3s come from voice/lines.js (made by voice/make_voice.py — edit lines there).
// Saved MP3s cost nothing to play. A line without one is spoken live with ElevenLabs if there's a key,
// otherwise with the built-in Mac voice.
const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";   // keep in sync with voice/make_voice.py
const VOICE_MODEL = "eleven_flash_v2_5";
const LOCK_MS = 1200;    // target held this long -> "locked"
const LOST_MS = 1500;    // target gone this long -> "lost"
const FIRE_COOLDOWN_MS = 3000;
const IDLE_MIN_MS = 25000, IDLE_MAX_MS = 45000;   // a random idle quip this often while nothing is in view

const FALLBACK_LINES = {
  any: { startup: ["Apex online."], idle: [] },
  face: { acquired: ["Human detected."], locked: ["Human locked in."], lost: ["Human lost."], firing: ["Firing."] },
  bullseye: { acquired: ["Bullseye detected."], locked: ["Bullseye locked in."], lost: ["Bullseye lost."], firing: ["Firing."] },
};
const LINES = window.VOICE_LINES || Object.fromEntries(Object.entries(FALLBACK_LINES).map(([mode, events]) =>
  [mode, Object.fromEntries(Object.entries(events).map(([ev, texts]) => [ev, texts.map(text => ({ text }))]))]));

// a random line for this event, in the current mode (or "any")
function line(event, mode = $("mode").value) {
  const list = LINES[mode]?.[event] || [];
  return list[Math.floor(Math.random() * list.length)];
}

// key is kept in this browser only
$("elkey").value = window.ELEVENLABS_KEY || "";
try { $("elkey").value = localStorage.getItem("elevenlabs_key") || $("elkey").value; } catch {}
$("elkey").addEventListener("change", () => {
  try { localStorage.setItem("elevenlabs_key", $("elkey").value.trim()); } catch {}
  audioCache.clear();
});

const audioCache = new Map();   // text -> Promise<blob url>, so a live line is only generated once per session
let speaking = false, pendingLine = null, lastTalk = 0;

function elevenAudio(text) {
  if (!audioCache.has(text)) {
    const p = fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}?output_format=mp3_44100_128`, {
      method: "POST",
      headers: { "xi-api-key": $("elkey").value.trim(), "Content-Type": "application/json" },
      body: JSON.stringify({ text, model_id: VOICE_MODEL }),
    }).then(async r => {
      if (!r.ok) throw new Error(`ElevenLabs ${r.status}: ${(await r.text()).slice(0, 120)}`);
      return URL.createObjectURL(await r.blob());
    });
    p.catch(() => audioCache.delete(text));   // retry next time instead of caching the failure
    audioCache.set(text, p);
  }
  return audioCache.get(text);
}

const playAudio = src => new Promise(res => {
  const a = new Audio(src);
  a.onended = a.onerror = res;
  a.play().catch(res);
});

async function say(entry) {
  if (!entry || !$("voice").checked) return;
  // never talk over itself: keep only the newest line and say it next
  if (speaking) { pendingLine = entry; return; }
  speaking = true;
  lastTalk = performance.now();
  try {
    if (entry.file) {
      await playAudio(entry.file);
    } else if ($("elkey").value.trim()) {
      await playAudio(await elevenAudio(entry.text));
    } else {
      await new Promise(res => {
        const u = new SpeechSynthesisUtterance(entry.text);
        u.onend = u.onerror = res;
        speechSynthesis.speak(u);
      });
    }
  } catch (e) {
    status("Voice error: " + e.message);
  } finally {
    speaking = false;
    lastTalk = performance.now();
    if (pendingLine) { const next = pendingLine; pendingLine = null; say(next); }
  }
}

const track = { phase: "idle", seenSince: 0, lastSeen: 0, wasFiring: false, lastFireCall: 0, idleGap: IDLE_MIN_MS };

function callouts(now) {
  if (state.face) {
    if (track.phase === "idle") { track.phase = "acquired"; track.seenSince = now; say(line("acquired")); }
    else if (track.phase === "acquired" && now - track.seenSince >= LOCK_MS) { track.phase = "locked"; say(line("locked")); }
    track.lastSeen = now;
  } else if (track.phase !== "idle" && now - track.lastSeen >= LOST_MS) {
    track.phase = "idle"; say(line("lost"));
  } else if (track.phase === "idle" && !speaking && now - lastTalk >= track.idleGap) {
    track.idleGap = IDLE_MIN_MS + Math.random() * (IDLE_MAX_MS - IDLE_MIN_MS);
    say(line("idle", "any"));
    lastTalk = now;
  }
  if (state.fire && !track.wasFiring && now - track.lastFireCall >= FIRE_COOLDOWN_MS) {
    track.lastFireCall = now; say(line("firing"));
  }
  track.wasFiring = state.fire;
}

// ---------- camera + face detection ----------
$("cam").onclick = async () => {
  $("cam").disabled = true;
  try {
    status("Loading face model...");
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
    });
    if ($("mode").value === "bullseye") await loadYolo();
    status("Starting camera...");
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" }, audio: false });
    await video.play();
    status(port ? "Tracking." : "Tracking. Connect the Arduino to move the turret.");
    say(line("startup", "any"));
    requestAnimationFrame(loop);
  } catch (e) {
    $("cam").disabled = false;
    status("Camera/model error: " + e.message);
  }
};

function detect() {
  if (video.readyState < 2) return;
  if ($("mode").value === "bullseye") return detectBullseye();   // async, aims when it finishes
  if (!detector) return;
  const res = detector.detectForVideo(video, performance.now());
  // pick the biggest face
  let best = null;
  for (const d of res.detections) {
    const b = d.boundingBox;
    if (!best || b.width * b.height > best.width * best.height) best = b;
  }
  state.face = best;
  if (best) aimAt(best);   // no face -> hold last aim
}

function aimAt(box) {
  const vw = video.videoWidth, vh = video.videoHeight;
  // mirror x so it matches what you see on screen
  const tx = 1 - (box.originX + box.width / 2) / vw;
  const ty = (box.originY + box.height / 2) / vh;
  state.fx += (tx - state.fx) * SMOOTH;
  state.fy += (ty - state.fy) * SMOOTH;
}

// ---------- bullseye detection (your trained YOLO model, run in the browser) ----------
// the model is packed into a .js file (by training/export.py) so the page works opened straight from disk
const BULLSEYE_MODEL = "models/bullseye.js";
const BULLSEYE_CONF = 0.45;                      // raise if it locks onto things that aren't the target
const YOLO_SIZE = 640;
const ORT_URL = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";
let yolo = null, yoloBusy = false;
const prep = Object.assign(document.createElement("canvas"), { width: YOLO_SIZE, height: YOLO_SIZE });
const pctx = prep.getContext("2d", { willReadFrequently: true });

async function loadYolo() {
  if (yolo) return;
  status("Loading bullseye model...");
  const ort = await import(ORT_URL + "ort.webgpu.min.mjs");
  ort.env.wasm.wasmPaths = ORT_URL;
  await new Promise((res, rej) => {
    const s = Object.assign(document.createElement("script"), { src: BULLSEYE_MODEL, onload: res });
    s.onerror = () => rej(new Error("missing " + BULLSEYE_MODEL + " — run training/export.py"));
    document.head.append(s);
  });
  const bytes = Uint8Array.from(atob(window.BULLSEYE_ONNX_B64), c => c.charCodeAt(0));
  const session = await ort.InferenceSession.create(bytes, { executionProviders: ["webgpu", "wasm"] });
  yolo = { ort, session };
}

async function detectBullseye() {
  if (!yolo || yoloBusy) return;   // one inference at a time; the page keeps drawing meanwhile
  yoloBusy = true;
  try {
    // letterbox the frame into a 640x640 square, same as training
    const vw = video.videoWidth, vh = video.videoHeight, s = YOLO_SIZE / Math.max(vw, vh);
    const px = (YOLO_SIZE - vw * s) / 2, py = (YOLO_SIZE - vh * s) / 2;
    pctx.fillStyle = "rgb(114,114,114)";
    pctx.fillRect(0, 0, YOLO_SIZE, YOLO_SIZE);
    pctx.drawImage(video, px, py, vw * s, vh * s);
    const rgba = pctx.getImageData(0, 0, YOLO_SIZE, YOLO_SIZE).data;
    const N = YOLO_SIZE * YOLO_SIZE, input = new Float32Array(3 * N);
    for (let i = 0; i < N; i++) {
      input[i] = rgba[i * 4] / 255;
      input[i + N] = rgba[i * 4 + 1] / 255;
      input[i + 2 * N] = rgba[i * 4 + 2] / 255;
    }
    const { ort, session } = yolo;
    const feeds = { [session.inputNames[0]]: new ort.Tensor("float32", input, [1, 3, YOLO_SIZE, YOLO_SIZE]) };
    const out = (await session.run(feeds))[session.outputNames[0]];
    // output is [1, 5, n]: rows are cx, cy, w, h, score — keep the most confident box
    const d = out.data, n = out.dims[2];
    let bi = -1, bs = BULLSEYE_CONF;
    for (let i = 0; i < n; i++) if (d[4 * n + i] > bs) { bs = d[4 * n + i]; bi = i; }
    if (bi < 0) { state.face = null; return; }
    const cx = d[bi], cy = d[n + bi], w = d[2 * n + bi], h = d[3 * n + bi];
    state.face = { originX: (cx - w / 2 - px) / s, originY: (cy - h / 2 - py) / s, width: w / s, height: h / s };
    aimAt(state.face);
  } catch (e) {
    status("Bullseye model error: " + e.message);
  } finally {
    yoloBusy = false;
  }
}

try { $("mode").value = localStorage.getItem("track_mode") || "face"; } catch {}
$("mode").addEventListener("change", async () => {
  try { localStorage.setItem("track_mode", $("mode").value); } catch {}
  state.face = null;
  track.phase = "idle";   // start fresh, without announcing "lost"
  if ($("mode").value === "bullseye") {
    try { await loadYolo(); status("Tracking bullseye."); }
    catch (e) { status("Couldn't load " + BULLSEYE_MODEL + ": " + e.message); $("mode").value = "face"; }
  }
});

function angles() {
  const { fx, fy } = state;
  // matches touchpad_turret.py
  const ax = $("invx").checked ? X_MIN + fx * (X_MAX - X_MIN) : X_MAX - fx * (X_MAX - X_MIN);
  const ay = $("invy").checked ? Y_MIN + fy * (Y_MAX - Y_MIN) : Y_MAX - fy * (Y_MAX - Y_MIN);
  // only move once the target has drifted past the deadband
  if (Math.abs(ax - state.ax) >= DEADBAND) state.ax = Math.round(ax);
  if (Math.abs(ay - state.ay) >= DEADBAND) state.ay = Math.round(ay);
  return [state.ax, state.ay];
}

// ---------- drawing ----------
function draw(ax, ay) {
  const r = canvas.getBoundingClientRect();
  if (canvas.width !== r.width || canvas.height !== r.height) { canvas.width = r.width; canvas.height = r.height; }
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // map video coords -> canvas (object-fit: cover + mirror)
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;

  if (state.face) {
    const b = state.face;
    ctx.strokeStyle = "rgba(77,163,255,.8)"; ctx.lineWidth = 2;
    ctx.strokeRect(W - (ox + (b.originX + b.width) * s), oy + b.originY * s, b.width * s, b.height * s);
  }

  const x = ox + state.fx * vw * s, y = oy + state.fy * vh * s;
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  ctx.strokeStyle = state.fire ? "#ff4d4d" : "#3ddc84"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();

  $("stage").classList.toggle("firing", state.fire);
  $("readout").textContent = `pan=${ax} tilt=${ay}  ${state.fire ? "MOTORS ON" : "motors off"}${track.phase === "locked" ? "  LOCKED" : state.face ? "" : "  (no target)"}`;
}

// ---------- serial ----------
async function send(line) {
  if (!writer || writing) return;   // drop frames instead of queueing a backlog
  writing = true;
  try { await writer.write(new TextEncoder().encode(line)); }
  catch (e) { status("Serial write failed: " + e.message); await disconnect(false); }
  finally { writing = false; }
}

$("connect").onclick = async () => {
  if (port) return disconnect(true);
  if (!("serial" in navigator)) return status("Web Serial not supported — use Chrome or Edge.");
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    status("Connected. Waiting for the Arduino to reset...");
    await new Promise(r => setTimeout(r, 2000));   // Uno resets when the port opens
    $("connect").textContent = "Disconnect";
    status(detector ? "Tracking." : "Connected. Start the camera.");
  } catch (e) {
    port = null; writer = null;
    status("Connect failed: " + e.message);
  }
};

async function disconnect(recenter) {
  const p = port, w = writer;
  port = null; writer = null;
  $("connect").textContent = "Connect Arduino";
  try {
    if (recenter && w) {
      while (writing) await new Promise(r => setTimeout(r, 5));
      await w.write(new TextEncoder().encode("90,90,0\n"));
      await new Promise(r => setTimeout(r, 300));
    }
    w?.releaseLock();
    await p?.close();
  } catch {}
  status("Disconnected. Servos centered, motors off.");
}

// ---------- fire controls ----------
const setFire = on => { state.fire = on; $("fire").classList.toggle("on", on); };
$("fire").addEventListener("pointerdown", e => { $("fire").setPointerCapture(e.pointerId); setFire(true); });
$("fire").addEventListener("pointerup", () => setFire(false));
$("fire").addEventListener("pointercancel", () => setFire(false));
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setFire(true); } });
addEventListener("keyup", e => { if (e.code === "Space") setFire(false); });
addEventListener("blur", () => setFire(false));

// ---------- main loop ----------
function loop() {
  detect();
  const [ax, ay] = angles();
  const now = performance.now();
  if (now - lastSend >= 1000 / SEND_HZ) {
    send(`${ax},${ay},${state.fire ? 1 : 0}\n`);
    lastSend = now;
  }
  callouts(now);
  draw(ax, ay);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
